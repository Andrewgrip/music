<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music</title>
  <meta name="description" content="Η μουσική μου: όλες οι playlists, αναζήτηση και αναπαραγωγή.">
  <meta name="theme-color" content="#0c0d0d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='56' fill='%230c0d0d'/%3E%3Cpath fill='%233cc47c' d='M196 40 84 68v98a30 30 0 1 0 14 26v-80l84-21v44a30 30 0 1 0 14 26z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#q">Μετάβαση στην αναζήτηση</a>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M212.92,25.69a8,8,0,0,0-6.86-1.45l-128,32A8,8,0,0,0,72,64V174.08A36,36,0,1,0,88,204V118.25l112-28v51.83A36,36,0,1,0,216,172V32A8,8,0,0,0,212.92,25.69Z"/></svg>Music</div>
      <label class="search">
        <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg>
        <input id="q" type="search" placeholder="Αναζήτηση τραγουδιού ή καλλιτέχνη" autocomplete="off" aria-label="Αναζήτηση">
        <kbd>/</kbd>
      </label>
      <button id="spotifySearch" class="link" type="button">Αναζήτηση στο Spotify <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M224,104a8,8,0,0,1-16,0V59.32l-66.33,66.34a8,8,0,0,1-11.32-11.32L196.68,48H152a8,8,0,0,1,0-16h64a8,8,0,0,1,8,8Zm-40,24a8,8,0,0,0-8,8v72H48V80h72a8,8,0,0,0,0-16H48A16,16,0,0,0,32,80V208a16,16,0,0,0,16,16H176a16,16,0,0,0,16-16V136A8,8,0,0,0,184,128Z"/></svg></button>
    </header>

    <main class="layout">
      <aside class="panel sidebar" aria-label="Βιβλιοθήκη">
        <div class="side-head">
          <h2>Βιβλιοθήκη</h2>
          <span id="plCount" class="count"></span>
        </div>
        <div class="side-filter">
          <input id="plFilter" type="search" placeholder="Φίλτρο playlists" autocomplete="off" aria-label="Φίλτρο playlists">
        </div>
        <nav id="playlists" class="playlists"></nav>
      </aside>

      <section class="panel library" aria-label="Τραγούδια">
        <div class="library-head">
          <div class="lh-text">
            <h2 id="listTitle">Όλα τα τραγούδια</h2>
            <span id="count" class="count"></span>
          </div>
          <button id="playList" class="icon-btn play small" type="button" aria-label="Παίξε αυτή τη λίστα"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"/></svg></button>
        </div>
        <div id="tracks" class="tracks"><div class="skeleton"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      </section>

      <section class="panel player-panel" aria-label="Τώρα παίζει">
        <div class="backdrop" id="backdrop" aria-hidden="true"></div>
        <div class="now-wrap">
          <div class="art-frame"><img id="art" class="art" alt="" width="640" height="640"></div>
          <div class="meta">
            <div class="eyebrow" id="eyebrow">Τώρα παίζει</div>
            <h1 id="nowTitle" class="now-title">Music 10K</h1>
            <p id="nowSub" class="now-sub">Όλη η λίστα</p>
          </div>
          <div class="controls">
            <button id="shuffle" class="icon-btn toggle" type="button" aria-label="Τυχαία σειρά"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M237.66,178.34a8,8,0,0,1,0,11.32l-24,24a8,8,0,0,1-11.32-11.32L212.69,192H200.94a72.12,72.12,0,0,1-58.59-30.15l-41.72-58.4A56.1,56.1,0,0,0,55.06,80H32a8,8,0,0,1,0-16H55.06a72.12,72.12,0,0,1,58.59,30.15l41.72,58.4A56.1,56.1,0,0,0,200.94,176h11.75l-10.35-10.34a8,8,0,0,1,11.32-11.32ZM143,107a8,8,0,0,0,11.16-1.86l1.2-1.67A56.1,56.1,0,0,1,200.94,80h11.75L202.34,90.34a8,8,0,0,0,11.32,11.32l24-24a8,8,0,0,0,0-11.32l-24-24a8,8,0,0,0-11.32,11.32L212.69,64H200.94a72.12,72.12,0,0,0-58.59,30.15l-1.2,1.67A8,8,0,0,0,143,107Zm-30,42a8,8,0,0,0-11.16,1.86l-1.2,1.67A56.1,56.1,0,0,1,55.06,176H32a8,8,0,0,0,0,16H55.06a72.12,72.12,0,0,0,58.59-30.15l1.2-1.67A8,8,0,0,0,113,149Z"/></svg><span class="tip" id="shuffleTip">Τυχαία σειρά</span></button>
            <button id="prev" class="icon-btn" type="button" aria-label="Προηγούμενο"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M56,32a8,8,0,0,1,8,8v69.23L183.57,34.45A15.95,15.95,0,0,1,208,47.88V208.12a16,16,0,0,1-24.43,13.43L64,146.77V216a8,8,0,0,1-16,0V40A8,8,0,0,1,56,32Z"/></svg><span class="tip">Προηγούμενο</span></button>
            <button id="playAll" class="icon-btn play" type="button" aria-label="Παίξε"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"/></svg><span class="tip">Παίξε</span></button>
            <button id="next" class="icon-btn" type="button" aria-label="Επόμενο"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M200,32a8,8,0,0,0-8,8v69.23L72.43,34.45A15.95,15.95,0,0,0,48,47.88V208.12a16,16,0,0,0,24.43,13.43L192,146.77V216a8,8,0,0,0,16,0V40A8,8,0,0,0,200,32Z"/></svg><span class="tip">Επόμενο</span></button>
            <button id="repeat" class="icon-btn repeat" type="button" aria-label="Επανάληψη"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M24,128A72.08,72.08,0,0,1,96,56H204.69L194.34,45.66a8,8,0,0,1,11.32-11.32l24,24a8,8,0,0,1,0,11.32l-24,24a8,8,0,0,1-11.32-11.32L204.69,72H96a56.06,56.06,0,0,0-56,56,8,8,0,0,1-16,0Zm200-8a8,8,0,0,0-8,8,56.06,56.06,0,0,1-56,56H51.31l10.35-10.34a8,8,0,0,0-11.32-11.32l-24,24a8,8,0,0,0,0,11.32l24,24a8,8,0,0,0,11.32-11.32L51.31,200H160a72.08,72.08,0,0,0,72-72A8,8,0,0,0,224,120Z"/><path class="once" d="M140,104v48a8,8,0,0,1-16,0V118.94l-4.42,2.22a8,8,0,0,1-7.16-14.32l16-8A8,8,0,0,1,140,104Z"/></svg><span class="tip" id="repeatTip">Επανάληψη λίστας</span></button>
          </div>
          <div class="embed-container">
            <div id="player"></div>
          </div>
        </div>
      </section>
    </main>

    <nav class="mobile-tabs" aria-label="Ενότητες">
      <button type="button" data-view="sidebar">Βιβλιοθήκη</button>
      <button type="button" data-view="library" class="active">Τραγούδια</button>
      <button type="button" data-view="player-panel">Τώρα παίζει</button>
    </nav>
  </div>

  <script>
    // Δεδομένα από το tracks.json:
    // { playlists: [{ name, n, first }], tracks: [[trackId, τίτλος, καλλιτέχνες, [δείκτες playlists]]] }
    // Η σελίδα παίζει με δική της ουρά: ένα-ένα τα τραγούδια της λίστας που βλέπεις.
    const MAX_SHOWN = 400;

    let PLAYLISTS = [];
    let TRACKS = [];
    let BY_ID = new Map();
    let controller = null;
    let view = 0;                // ποια λίστα βλέπουμε (-1 = όλα τα τραγούδια)
    let queue = [];              // ουρά αναπαραγωγής (track ids)
    let qi = -1;                 // θέση στην ουρά
    let queueName = "";
    let shuffle = false;

    const $ = id => document.getElementById(id);
    const q = $("q"), list = $("tracks"), plNav = $("playlists");
    const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
    const recall = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

    /* ---------- Εξώφυλλα (oEmbed του Spotify) ---------- */
    // ζητάμε τα εξώφυλλα ένα-ένα (όχι όλα μαζί, για να μη μας μπλοκάρει το Spotify)
    // και τα κρατάμε στον browser για τις επόμενες φορές
    const artCache = {};
    let artSaved = {};
    try { artSaved = JSON.parse(localStorage.getItem("art") || "{}"); } catch (e) {}
    let artQueue = Promise.resolve();
    let saveTimer = null;
    function rememberArt(id, url) {
      artSaved[id] = url;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => store("art", JSON.stringify(artSaved)), 1000);
    }
    function fetchArt(trackId, big) {
      const up = u => big ? u.replace("ab67616d00001e02", "ab67616d0000b273") : u;
      if (artSaved[trackId]) return Promise.resolve(up(artSaved[trackId]));
      if (!artCache[trackId]) {
        artCache[trackId] = artQueue = artQueue.then(() =>
          fetch("https://open.spotify.com/oembed?url=" +
            encodeURIComponent("https://open.spotify.com/track/" + trackId))
            .then(r => r.ok ? r.json() : {})
            .then(j => { const u = j.thumbnail_url || ""; if (u) rememberArt(trackId, u); return u; })
            .catch(() => "")
            .then(u => new Promise(res => setTimeout(() => res(u), 150))));
      }
      return artCache[trackId].then(up);
    }

    const artObserver = new IntersectionObserver(entries => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        const img = e.target;
        artObserver.unobserve(img);
        fetchArt(img.dataset.t).then(src => {
          if (src) { img.onload = () => img.classList.add("in"); img.src = src; }
        }).catch(() => {});
      }
    }, { root: plNav, rootMargin: "100px" });

    /* ---------- Βιβλιοθήκη (αριστερά) ---------- */
    function renderPlaylists() {
      const f = norm($("plFilter").value.trim());
      const items = [{ i: -1, name: "Όλα τα τραγούδια", n: TRACKS.length }]
        .concat(PLAYLISTS.map((p, i) => ({ i, name: p.name, n: p.n, first: p.first })))
        .filter(p => !f || norm(p.name).includes(f));
      plNav.innerHTML = items.map(p =>
        '<button type="button" class="pl' + (p.i === view ? " active" : "") + '" data-i="' + p.i + '">' +
          (p.i === -1
            ? '<span class="pl-art all"><svg viewBox="0 0 256 256"><path d="M212.92,25.69a8,8,0,0,0-6.86-1.45l-128,32A8,8,0,0,0,72,64V174.08A36,36,0,1,0,88,204V118.25l112-28v51.83A36,36,0,1,0,216,172V32A8,8,0,0,0,212.92,25.69Z"/></svg></span>'
            : '<span class="pl-art"><img alt="" data-t="' + p.first + '"></span>') +
          '<span class="pl-text"><span class="pl-name">' + esc(p.name) + '</span><span class="pl-sub">' +
          p.n.toLocaleString("el-GR") + " τραγούδια</span></span></button>").join("");
      plNav.querySelectorAll("img[data-t]").forEach(img => artObserver.observe(img));
      $("plCount").textContent = PLAYLISTS.length + " playlists";
    }

    $("plFilter").addEventListener("input", renderPlaylists);
    plNav.addEventListener("click", e => {
      const b = e.target.closest(".pl");
      if (!b) return;
      view = +b.dataset.i;
      store("view", view);
      q.value = "";
      renderPlaylists();
      renderList();
      showView("library");
    });

    /* ---------- Λίστα τραγουδιών (μέση) ---------- */
    let shown = [];
    let kb = -1;

    function viewTracks() {
      return view === -1 ? TRACKS : PLAYLISTS[view].tracks;
    }

    function renderList() {
      const term = norm(q.value.trim());
      const words = term ? term.split(/\s+/) : [];
      // η αναζήτηση ψάχνει πάντα σε όλα
      shown = words.length ? TRACKS.filter(t => words.every(w => t.search.includes(w))) : viewTracks();
      $("listTitle").textContent = words.length ? "Αποτελέσματα" : view === -1 ? "Όλα τα τραγούδια" : PLAYLISTS[view].name;
      $("count").textContent = shown.length.toLocaleString("el-GR") + " τραγούδια";
      $("playList").hidden = !shown.length;
      kb = -1;
      if (!shown.length) {
        list.innerHTML = '<div class="empty">' + (words.length
          ? "Δεν υπάρχει στη βιβλιοθήκη. Δοκίμασε «Αναζήτηση στο Spotify» πάνω δεξιά."
          : "Η λίστα είναι άδεια.") + "</div>";
        return;
      }
      const playingId = queue[qi];
      list.innerHTML = shown.slice(0, MAX_SHOWN).map((t, i) =>
        '<button class="track' + (t.id === playingId ? " playing" : "") + '" type="button" style="--i:' +
        Math.min(i, 24) + '" data-k="' + i + '" data-id="' + t.id + '"><span class="num">' + (i + 1) +
        '</span><span class="t-main"><span class="title">' + esc(t.title) + '</span><span class="artist">' +
        esc(t.artists) + "</span></span>" +
        (words.length && t.lists.length ? '<span class="t-in">' + esc(PLAYLISTS[t.lists[0]].name) +
          (t.lists.length > 1 ? " +" + (t.lists.length - 1) : "") + "</span>" : "") +
        "</button>").join("") +
        (shown.length > MAX_SHOWN ? '<div class="empty">Και άλλα ' + (shown.length - MAX_SHOWN).toLocaleString("el-GR") +
          ". Γράψε στην αναζήτηση για να τα βρεις.</div>" : "");
      list.scrollTop = 0;
    }

    q.addEventListener("input", () => { renderList(); showView("library"); });
    q.addEventListener("keydown", e => {
      const items = [...list.querySelectorAll(".track")];
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!items.length) return;
        e.preventDefault();
        kb = (kb + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        items.forEach((b, i) => b.classList.toggle("kb", i === kb));
        items[kb].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        e.preventDefault();
        const target = items[kb >= 0 ? kb : 0];
        if (target) startQueue(+target.dataset.k);
        else $("spotifySearch").click();
      } else if (e.key === "Escape") {
        q.value = ""; renderList();
      }
    });

    list.addEventListener("click", e => {
      const b = e.target.closest(".track");
      if (b) startQueue(+b.dataset.k);
    });

    $("spotifySearch").addEventListener("click", () => {
      const term = q.value.trim();
      window.open("https://open.spotify.com/search" + (term ? "/" + encodeURIComponent(term) : ""), "_blank", "noopener");
    });

    /* ---------- Ουρά αναπαραγωγής ---------- */
    function shuffled(arr, keepFirst) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      if (keepFirst != null) { a.splice(a.indexOf(keepFirst), 1); a.unshift(keepFirst); }
      return a;
    }

    // ξεκινά να παίζει τη λίστα που φαίνεται τώρα, από το τραγούδι k
    function startQueue(k) {
      const ids = shown.map(t => t.id);
      const first = ids[k] || ids[0];
      queue = shuffle ? shuffled(ids, first) : ids;
      qi = queue.indexOf(first);
      queueName = $("listTitle").textContent;
      playCurrent();
      showView("player-panel");
    }

    function playCurrent() {
      const id = queue[qi];
      if (!id) return;
      resetEnd();
      setNow();
      store("last", id);
      if (controller) {
        controller.loadUri("spotify:track:" + id);
        controller.play();
      } else {
        const iframe = document.querySelector(".embed-container iframe");
        if (iframe) iframe.src = "https://open.spotify.com/embed/track/" + id;
      }
    }

    function step(dir) {
      if (!queue.length) { startQueue(0); return; }
      qi = (qi + dir + queue.length) % queue.length;   // στο τέλος ξαναρχίζει (επανάληψη λίστας)
      playCurrent();
    }

    $("next").addEventListener("click", () => step(1));
    $("prev").addEventListener("click", () => step(-1));
    $("playList").addEventListener("click", () => startQueue(0));
    $("playAll").addEventListener("click", () => queue.length ? playCurrent() : startQueue(0));

    const shuffleBtn = $("shuffle");
    shuffle = recall("shuffle") === "1";
    function updateShuffle() {
      shuffleBtn.classList.toggle("on", shuffle);
      $("shuffleTip").textContent = shuffle ? "Τυχαία σειρά: ναι" : "Τυχαία σειρά: όχι";
    }
    updateShuffle();
    shuffleBtn.addEventListener("click", () => {
      shuffle = !shuffle;
      store("shuffle", shuffle ? "1" : "0");
      updateShuffle();
      if (shuffle && queue.length) {          // ανακατεύει ό,τι μένει, το τρέχον μένει πρώτο
        const cur = queue[qi];
        queue = shuffled(queue, cur);
        qi = 0;
      }
    });

    /* ---------- Τώρα παίζει (δεξιά) ---------- */
    function setNow() {
      const t = BY_ID.get(queue[qi]);
      if (!t) return;
      $("eyebrow").textContent = queueName ? "Από: " + queueName : "Τώρα παίζει";
      $("nowTitle").textContent = t.title;
      $("nowSub").textContent = t.artists;
      document.title = t.title + " · Music";
      list.querySelectorAll(".track").forEach(b => b.classList.toggle("playing", b.dataset.id === t.id));
      const id = t.id;
      fetchArt(id, true).then(src => {
        if (id !== queue[qi] || !src) return;
        const art = $("art");
        art.classList.remove("in");
        art.onload = () => art.classList.add("in");
        art.src = src;
        $("backdrop").style.backgroundImage = "url(" + src + ")";
      }).catch(() => {});
    }

    /* ---------- Επανάληψη ----------
       "all": στο τέλος του τραγουδιού πάει στο επόμενο· μετά το τελευταίο ξαναρχίζει η λίστα
       "one": το ίδιο τραγούδι ξαναπαίζει από την αρχή                                        */
    let repeatMode = recall("repeatMode") === "one" ? "one" : "all";
    const repeatBtn = $("repeat");
    function updateRepeat() {
      repeatBtn.classList.toggle("one", repeatMode === "one");
      $("repeatTip").textContent = repeatMode === "one" ? "Επανάληψη τραγουδιού" : "Επανάληψη λίστας";
    }
    updateRepeat();
    repeatBtn.addEventListener("click", () => {
      repeatMode = repeatMode === "one" ? "all" : "one";
      store("repeatMode", repeatMode);
      updateRepeat();
    });

    let last = { pos: 0, dur: 0 }, wasPlaying = false, busy = false, seekedBack = false;
    function resetEnd() { last = { pos: 0, dur: 0 }; wasPlaying = false; seekedBack = false; }

    function onPlayback(e) {
      const d = e.data || {};
      const pos = d.position || 0, dur = d.duration || 0;
      if (busy) return;

      if (repeatMode === "one" && !d.isPaused && dur > 0) {
        if (!seekedBack && dur - pos < 1200) { seekedBack = true; controller.seek(0); }
        else if (pos < 3000) seekedBack = false;
      }

      const nearEndBefore = last.dur > 0 && last.pos >= last.dur - 6000;
      const ended = wasPlaying && d.isPaused && !d.isBuffering &&
        ((dur > 0 && pos >= dur - 6000) || (pos === 0 && nearEndBefore));
      if (!d.isPaused) wasPlaying = true;
      last = { pos, dur };
      if (!ended) return;

      busy = true;
      wasPlaying = false;
      if (repeatMode === "one") controller.play();
      else step(1);
      setTimeout(() => { busy = false; }, 1500);
    }

    /* ---------- Κινητό: καρτέλες ---------- */
    function showView(name) {
      document.body.dataset.view = name;
      document.querySelectorAll(".mobile-tabs button").forEach(b =>
        b.classList.toggle("active", b.dataset.view === name));
    }
    document.querySelector(".mobile-tabs").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (b) showView(b.dataset.view);
    });
    showView("library");

    /* ---------- Φόρτωση ---------- */
    fetch("tracks.json")
      .then(r => r.json())
      .then(data => {
        PLAYLISTS = data.playlists.map(p => ({ ...p, tracks: [] }));
        TRACKS = data.tracks.map(([id, title, artists, lists]) =>
          ({ id, title, artists, lists: lists || [], search: norm(title + " " + artists) }));
        for (const t of TRACKS) {
          BY_ID.set(t.id, t);
          for (const i of t.lists) PLAYLISTS[i].tracks.push(t);
        }
        const savedView = +recall("view");
        view = Number.isInteger(savedView) && savedView < PLAYLISTS.length ? savedView : 0;
        q.placeholder = "Αναζήτηση σε " + TRACKS.length.toLocaleString("el-GR") + " τραγούδια";
        document.addEventListener("keydown", e => {
          if (e.key === "/" && document.activeElement !== q && document.activeElement !== $("plFilter")) {
            e.preventDefault(); q.focus();
          }
        });
        renderPlaylists();
        renderList();
        // ετοιμάζει την ουρά με τη λίστα που βλέπεις, χωρίς να ξεκινήσει μόνο του
        const lastId = recall("last");
        queue = shown.map(t => t.id);
        qi = Math.max(0, queue.indexOf(lastId));
        queueName = $("listTitle").textContent;
        setNow();
        if (controller) controller.loadUri("spotify:track:" + queue[qi]);
      })
      .catch(() => { list.innerHTML = '<div class="empty">Η λίστα δεν φόρτωσε. Ανανέωσε τη σελίδα.</div>'; });

    window.onSpotifyIframeApiReady = IFrameAPI => {
      IFrameAPI.createController(
        $("player"),
        { uri: "spotify:track:" + (recall("last") || "0nNlBtm1vuo9vlU9PYYuc5"), width: "100%", height: 152 },
        c => {
          controller = c;
          c.addListener("playback_update", onPlayback);
          if (queue[qi]) c.loadUri("spotify:track:" + queue[qi]);
        }
      );
    };

    setTimeout(() => {
      if (!controller && !document.querySelector(".embed-container iframe")) {
        $("player").outerHTML =
          '<iframe src="https://open.spotify.com/embed/track/' + (queue[qi] || "0nNlBtm1vuo9vlU9PYYuc5") + '" ' +
          'allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" ' +
          'allowfullscreen loading="lazy"></iframe>';
      }
    }, 4000);
  </script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
