<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="search-bar">
    <input id="q" type="search" placeholder="Αναζήτηση τραγουδιού ή καλλιτέχνη..." autocomplete="off">
    <button id="spotifySearch" class="primary" type="button">Αναζήτηση στο Spotify</button>
    <div id="results" class="results"></div>
  </div>

  <div id="tabs" class="tabs"></div>

  <div class="embed-container">
    <div id="player"></div>
  </div>

  <script>
    // Οι playlists και τα τραγούδια τους φορτώνονται από το tracks.json
    // Μορφή: { playlists: [{id, name}], tracks: [[trackId, τίτλος, καλλιτέχνες, [δείκτες playlists]]] }
    const START_PLAYLIST = 0;     // με ποια playlist ανοίγει η σελίδα (θέση στο tracks.json)
    const MAX_RESULTS = 50;

    let PLAYLISTS = [];
    let TRACKS = [];
    let controller = null;
    let active = -1;
    let current = START_PLAYLIST;

    const q = document.getElementById("q");
    const results = document.getElementById("results");
    const tabs = document.getElementById("tabs");

    const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function load(uri) {
      if (controller) {
        controller.loadUri(uri);
        controller.play();
      } else {
        const iframe = document.querySelector(".embed-container iframe");
        const [, type, id] = uri.split(":");
        if (iframe) iframe.src = "https://open.spotify.com/embed/" + type + "/" + id;
      }
    }

    function showPlaylist(i) {
      current = i;
      [...tabs.children].forEach((b, k) => b.classList.toggle("active", k === i));
      load("spotify:playlist:" + PLAYLISTS[i].id);
    }

    function renderTabs() {
      tabs.innerHTML = PLAYLISTS.map((p, i) =>
        '<button type="button" data-i="' + i + '">' + escapeHtml(p.name) + "</button>").join("");
      tabs.children[current]?.classList.add("active");
    }

    tabs.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (b) showPlaylist(+b.dataset.i);
    });

    function render() {
      const term = norm(q.value.trim());
      active = -1;
      if (!term) { results.classList.remove("open"); results.innerHTML = ""; return; }
      const words = term.split(/\s+/);
      const found = [];
      for (const t of TRACKS) {
        if (words.every(w => t.search.includes(w))) {
          found.push(t);
          if (found.length >= MAX_RESULTS) break;
        }
      }
      results.innerHTML = found.length
        ? found.map(t =>
            '<button type="button" data-id="' + t.id + '"><span class="text">' + escapeHtml(t.title) +
            '<span class="artist">' + escapeHtml(t.artists) +
            ' · <span class="in">' + escapeHtml(t.lists.map(i => PLAYLISTS[i].name).join(", ")) +
            "</span></span></span></button>").join("")
        : '<div class="empty">Δεν βρέθηκε. Πατήστε «Αναζήτηση στο Spotify».</div>';
      results.classList.add("open");
    }

    function pick(id) {
      load("spotify:track:" + id);
      [...tabs.children].forEach(b => b.classList.remove("active"));
      results.classList.remove("open");
    }

    q.addEventListener("input", render);
    q.addEventListener("focus", render);

    q.addEventListener("keydown", e => {
      const items = [...results.querySelectorAll("button")];
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!items.length) return;
        e.preventDefault();
        active = (active + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        items.forEach((b, i) => b.classList.toggle("active", i === active));
        items[active].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        e.preventDefault();
        const target = items[active >= 0 ? active : 0];
        if (target) pick(target.dataset.id);
        else document.getElementById("spotifySearch").click();
      } else if (e.key === "Escape") {
        results.classList.remove("open");
      }
    });

    results.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (b) pick(b.dataset.id);
    });

    document.addEventListener("click", e => {
      if (!e.target.closest(".search-bar")) results.classList.remove("open");
    });

    document.getElementById("spotifySearch").addEventListener("click", () => {
      const term = q.value.trim();
      window.open("https://open.spotify.com/search" + (term ? "/" + encodeURIComponent(term) : ""), "_blank", "noopener");
    });

    // Φόρτωση δεδομένων
    fetch("tracks.json")
      .then(r => r.json())
      .then(data => {
        PLAYLISTS = data.playlists;
        TRACKS = data.tracks.map(([id, title, artists, lists]) =>
          ({ id, title, artists, lists, search: norm(title + " " + artists) }));
        renderTabs();
        q.placeholder = "Αναζήτηση σε " + TRACKS.length.toLocaleString("el-GR") + " τραγούδια...";
      })
      .catch(() => { q.placeholder = "Η λίστα αναζήτησης δεν φόρτωσε"; });

    // Spotify iFrame API
    window.onSpotifyIframeApiReady = IFrameAPI => {
      IFrameAPI.createController(
        document.getElementById("player"),
        { uri: "spotify:playlist:0ZfeJ66fKPdTgQf5XbXOTf", width: "100%", height: "100%" },
        c => { controller = c; }
      );
    };

    // Αν δεν φορτώσει το API, απλό iframe
    setTimeout(() => {
      if (!controller && !document.querySelector(".embed-container iframe")) {
        document.getElementById("player").outerHTML =
          '<iframe src="https://open.spotify.com/embed/playlist/0ZfeJ66fKPdTgQf5XbXOTf" ' +
          'allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" ' +
          'allowfullscreen loading="lazy"></iframe>';
      }
    }, 4000);
  </script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
