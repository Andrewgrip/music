<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="search-bar">
    <input id="q" type="search" placeholder="Αναζήτηση τραγουδιού ή καλλιτέχνη..." autocomplete="off">
    <button id="spotifySearch" class="primary" type="button">Αναζήτηση στο Spotify</button>
    <button id="repeat" type="button">🔁 Επανάληψη: Όλη η λίστα</button>
    <div id="results" class="results"></div>
  </div>

  <div class="embed-container">
    <div id="player"></div>
  </div>

  <script>
    // Οι playlists και τα τραγούδια τους φορτώνονται από το tracks.json
    // Μορφή: { playlists: [{id, name}], tracks: [[trackId, τίτλος, καλλιτέχνες, [δείκτες playlists]]] }
    const MAX_RESULTS = 50;

    let PLAYLISTS = [];
    let TRACKS = [];
    let controller = null;
    let active = -1;

    const q = document.getElementById("q");
    const results = document.getElementById("results");

    const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    const MAIN_URI = "spotify:playlist:4NTuH5mnRYIe4Yv4YmN6Lg"; // Music 10K

    // Επανάληψη: "all" = όταν τελειώσει η λίστα ξεκινά από την αρχή,
    //            "one" = το τραγούδι που παίζει ξαναπαίζει από την αρχή
    let repeatMode = "all";
    try { if (localStorage.getItem("repeatMode") === "one") repeatMode = "one"; } catch (e) {}
    const repeatBtn = document.getElementById("repeat");
    function updateRepeat() {
      repeatBtn.textContent = repeatMode === "one" ? "🔂 Επανάληψη: Αυτό το τραγούδι" : "🔁 Επανάληψη: Όλη η λίστα";
      repeatBtn.classList.toggle("on", repeatMode === "one");
    }
    updateRepeat();
    repeatBtn.addEventListener("click", () => {
      repeatMode = repeatMode === "one" ? "all" : "one";
      try { localStorage.setItem("repeatMode", repeatMode); } catch (e) {}
      updateRepeat();
    });

    let currentUri = MAIN_URI;
    let wasPlaying = false;
    let restarting = false;
    let seekedBack = false;
    let lastPos = 0, lastDur = 0;

    function onPlayback(e) {
      const d = e.data || {};
      const pos = d.position || 0, dur = d.duration || 0;

      // Ένα τραγούδι: λίγο πριν τελειώσει, γύρνα στην αρχή του
      if (repeatMode === "one" && !d.isPaused && dur > 0) {
        if (!seekedBack && dur - pos < 1500) {
          seekedBack = true;
          controller.seek(0);
        } else if (pos < 5000) {
          seekedBack = false;
        }
      }

      // Όλη η λίστα (ή ένα τραγούδι αν ο player πρόλαβε να σταματήσει):
      // όταν σταματήσει στο τέλος, ξεκίνα ξανά
      const atEnd = dur > 0 && pos >= dur - 1500;
      const wasNearEnd = lastDur > 0 && lastPos >= lastDur - 2500;
      const ended = wasPlaying && d.isPaused && !d.isBuffering && (atEnd || (pos === 0 && wasNearEnd));
      if (!d.isPaused) wasPlaying = true;
      lastPos = pos;
      lastDur = dur;
      if (!ended || restarting) return;
      wasPlaying = false;
      restarting = true;
      if (repeatMode === "one") {
        controller.seek(0);
        setTimeout(() => { controller.resume(); restarting = false; }, 500);
      } else {
        currentUri = MAIN_URI;
        controller.loadUri(MAIN_URI);
        setTimeout(() => { controller.play(); restarting = false; }, 800);
      }
    }

    function load(uri) {
      currentUri = uri;
      wasPlaying = false;
      if (controller) {
        controller.loadUri(uri);
        controller.play();
      } else {
        const iframe = document.querySelector(".embed-container iframe");
        const [, type, id] = uri.split(":");
        if (iframe) iframe.src = "https://open.spotify.com/embed/" + type + "/" + id;
      }
    }

    function render() {
      const term = norm(q.value.trim());
      active = -1;
      if (!term) { results.classList.remove("open"); results.innerHTML = ""; return; }
      const words = term.split(/\s+/);
      const found = [];
      for (const t of TRACKS) {
        if (words.every(w => t.search.includes(w))) {
          found.push(t);
          if (found.length >= MAX_RESULTS) break;
        }
      }
      results.innerHTML = found.length
        ? found.map(t =>
            '<button type="button" data-id="' + t.id + '"><span class="text">' + escapeHtml(t.title) +
            '<span class="artist">' + escapeHtml(t.artists) +
            "</span></span></button>").join("")
        : '<div class="empty">Δεν βρέθηκε. Πατήστε «Αναζήτηση στο Spotify».</div>';
      results.classList.add("open");
    }

    function pick(id) {
      load("spotify:track:" + id);
      results.classList.remove("open");
    }

    q.addEventListener("input", render);
    q.addEventListener("focus", render);

    q.addEventListener("keydown", e => {
      const items = [...results.querySelectorAll("button")];
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!items.length) return;
        e.preventDefault();
        active = (active + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        items.forEach((b, i) => b.classList.toggle("active", i === active));
        items[active].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        e.preventDefault();
        const target = items[active >= 0 ? active : 0];
        if (target) pick(target.dataset.id);
        else document.getElementById("spotifySearch").click();
      } else if (e.key === "Escape") {
        results.classList.remove("open");
      }
    });

    results.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (b) pick(b.dataset.id);
    });

    document.addEventListener("click", e => {
      if (!e.target.closest(".search-bar")) results.classList.remove("open");
    });

    document.getElementById("spotifySearch").addEventListener("click", () => {
      const term = q.value.trim();
      window.open("https://open.spotify.com/search" + (term ? "/" + encodeURIComponent(term) : ""), "_blank", "noopener");
    });

    // Φόρτωση δεδομένων
    fetch("tracks.json")
      .then(r => r.json())
      .then(data => {
        PLAYLISTS = data.playlists;
        TRACKS = data.tracks.map(([id, title, artists, lists]) =>
          ({ id, title, artists, lists, search: norm(title + " " + artists) }));
        q.placeholder = "Αναζήτηση σε " + TRACKS.length.toLocaleString("el-GR") + " τραγούδια...";
      })
      .catch(() => { q.placeholder = "Η λίστα αναζήτησης δεν φόρτωσε"; });

    // Spotify iFrame API
    window.onSpotifyIframeApiReady = IFrameAPI => {
      IFrameAPI.createController(
        document.getElementById("player"),
        { uri: MAIN_URI, width: "100%", height: "100%" },
        c => { controller = c; c.addListener("playback_update", onPlayback); }
      );
    };

    // Αν δεν φορτώσει το API, απλό iframe
    setTimeout(() => {
      if (!controller && !document.querySelector(".embed-container iframe")) {
        document.getElementById("player").outerHTML =
          '<iframe src="https://open.spotify.com/embed/playlist/4NTuH5mnRYIe4Yv4YmN6Lg" ' +
          'allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" ' +
          'allowfullscreen loading="lazy"></iframe>';
      }
    }, 4000);
  </script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
