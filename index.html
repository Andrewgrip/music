<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="search-bar">
    <input id="q" type="search" placeholder="Αναζήτηση τραγουδιού ή καλλιτέχνη..." autocomplete="off">
    <button id="spotifySearch" class="primary" type="button">Αναζήτηση στο Spotify</button>
    <button id="backToPlaylist" type="button">Όλη η playlist</button>
    <div id="results" class="results"></div>
  </div>

  <div class="embed-container">
    <div id="player"></div>
  </div>

  <script>
    const PLAYLIST = "spotify:playlist:0ZfeJ66fKPdTgQf5XbXOTf";

    // Τραγούδια της playlist "My favorite" (id, τίτλος, καλλιτέχνες)

      ["0nNlBtm1vuo9vlU9PYYuc5","MOTORA","Bres, Verde"],
      ["3lS1r65AbkPdljhDrRQEyV","Aeroplana","Bloody Hawk, TOQUEL"],

      ["1nMUQpB8QRueb9aHPuSHmr","SMACKDOWN","Ivan Greko, Sanko"],
      ["4VDkRSQlaSFYij6xfspoLj","WW3","Trannos"],

      ["7nWCBmf2cLyMzXQTnYgSvr","PERCO","Ivan Greko, Arab, BeTaf Beats"],
      ["7Ku2O5h0e3NH1qGcuZvGWT","CHOCO FRESH","HermesHermes, Ivan Greko, Arab"],

      ["6R2utRyFhiEBnyz6afQ9Pe","ILEGAL","TOQUEL, FLY LO, Beyond"],
      ["7r0sYhhoM4hjeuCDlbCobZ","DOLCE GABBANA","TOQUEL, FLY LO, Beyond"],
      ["13Z7q7uTvkAK3qPN2jkDls","24hrs","Light, Trannos"],
      ["0TkxsUxBTNV8r1R2tOFumj","Book of ra","Arab, ASOK, 1Κ Chainz"],
      ["5BpN9zp9wzg0Tem1n5W3kR","Only The Fam","Block 93, Sp93, Tanto, mi368"],

      ["1ob6WCVuZIO5qk7jiRrHjn","Tropicana","Trannos"],
      ["3C4vDKPYaUpG0ZH8y4axeV","GIMMIE","Ivan Greko, BeTaf Beats"],
      ["5sevJDfYQG35a414MpthiM","TAMAM","RACK, Sin Laurent"],
      ["1f8q0UF64hUKlEezIzIc4N","GRISELDA","RACK, VIDO, Sin Laurent"],
      ["6BbY1PRIpGi8jxyzmrSibV","BLACK PHONE MAFIA","Ivan Greko, Strat, Arab, DIFF, BeTaf Beats, Sanko"],
      ["7melDBnvzx5TU4yxOgT1MF","GOAL","Arab, BeTaf Beats"],
      ["6P9P1j0v2KiDu4vxW3T1WS","GUZMAN","Ivan Greko, Arab, Sanko"],
      ["2G7lPxGsVuwaO8uzQmw1BL","PISSA","Ivan Greko, Arab, BeTaf Beats, DIFF, ASOK"],
      ["2wTyM2gmuk3MdXVPDLNdmE","CZ","Ivan Greko, Arab, BeTaf Beats, Saxpas"],
      ["2nagfvFWn2rdPsmWcmmHcs","Crystal","FLY LO, Mike G"],
      ["14JWdvYsWAx7csssKvakQK","SILLY BOY","Ivan Greko, Trannos, BeTaf Beats"],
      ["7LayhRPJMFiJv2oiOHxlmH","Adam & Eve","Light, Noizy"],
      ["5XM5BN2S3HLTaK4wvC7RZe","KLEIDIA","SNIK, Trannos"],
      ["7h1NvRW2thbYlh0esXXORO","Baila","Light, Arab"],
      ["0upFohXrGxIIAjyaJmCkMU","Tokyo Drift (Fast & Furious)","Teriyaki Boyz"],
      ["0f7gbjwkZOs9loj2fr0lGH","There It Go (The Whistle Song)","Juelz Santana"],
      ["2O6rvtuZnW3yCa1ASbTk6g","SEADOO","Arab, Lami"],
      ["2ZRo7axmMPeSVUvDbGkJah","Hope","XXXTENTACION"],
      ["6ifNuuYjiS5NdMabN4Jvrs","Six Days - Remix","DJ Shadow, Mos Def"]
    ];

    const q = document.getElementById("q");
    const results = document.getElementById("results");
    let controller = null;
    let active = -1;

    // Αφαιρεί τόνους/κεφαλαία ώστε η αναζήτηση να βρίσκει πιο εύκολα
    const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

    function escapeHtml(s) {
      return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function load(uri) {
      if (controller) {
        controller.loadUri(uri);
        controller.play();
      } else {
        const [, type, id] = uri.split(":");
        document.querySelector(".embed-container iframe").src =
          "https://open.spotify.com/embed/" + type + "/" + id;
      }
    }

    function render() {
      const term = norm(q.value.trim());
      active = -1;
      if (!term) { results.classList.remove("open"); results.innerHTML = ""; return; }
      const found = TRACKS.filter(t => norm(t[1] + " " + t[2]).includes(term));
      results.innerHTML = found.length
        ? found.map(t =>
            '<button type="button" data-id="' + t[0] + '">' + escapeHtml(t[1]) +
            '<span class="artist">' + escapeHtml(t[2]) + "</span></button>").join("")
        : '<div class="empty">Δεν βρέθηκε στην playlist. Πατήστε «Αναζήτηση στο Spotify».</div>';
      results.classList.add("open");
    }

    function pick(id) {
      load("spotify:track:" + id);
      results.classList.remove("open");
    }

    q.addEventListener("input", render);
    q.addEventListener("focus", render);

    q.addEventListener("keydown", e => {
      const items = [...results.querySelectorAll("button")];
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!items.length) return;
        e.preventDefault();
        active = (active + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        items.forEach((b, i) => b.classList.toggle("active", i === active));
        items[active].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        e.preventDefault();
        const target = items[active >= 0 ? active : 0];
        if (target) pick(target.dataset.id);
        else document.getElementById("spotifySearch").click();
      } else if (e.key === "Escape") {
        results.classList.remove("open");
      }
    });

    results.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (b) pick(b.dataset.id);
    });

    document.addEventListener("click", e => {
      if (!e.target.closest(".search-bar")) results.classList.remove("open");
    });

    document.getElementById("spotifySearch").addEventListener("click", () => {
      const term = q.value.trim();
      const url = "https://open.spotify.com/search" + (term ? "/" + encodeURIComponent(term) : "");
      window.open(url, "_blank", "noopener");
    });

    document.getElementById("backToPlaylist").addEventListener("click", () => {
      q.value = "";
      results.classList.remove("open");
      load(PLAYLIST);
    });

    // Spotify iFrame API: επιτρέπει αλλαγή τραγουδιού και αυτόματο play
    window.onSpotifyIframeApiReady = IFrameAPI => {
      IFrameAPI.createController(
        document.getElementById("player"),
        { uri: PLAYLIST, width: "100%", height: "100%" },
        c => { controller = c; }
      );
    };

    // Αν δεν φορτώσει το API, βάζουμε απλό iframe
    setTimeout(() => {
      if (!controller && !document.querySelector(".embed-container iframe")) {
        document.getElementById("player").outerHTML =
          '<iframe src="https://open.spotify.com/embed/playlist/0ZfeJ66fKPdTgQf5XbXOTf" ' +
          'allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" ' +
          'allowfullscreen loading="lazy"></iframe>';
      }
    }, 4000);
  </script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
